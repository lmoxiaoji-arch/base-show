<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechSun WebGL Parallax Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="logo-container">
        <img src="logo.png" alt="TechSun" class="brand-logo">
    </div>

    <div class="viewport">
        <div id="stage" class="stage">
            <div id="layer-clouds" class="layer layer-clouds"></div>
            <div id="layer-under" class="layer layer-under"></div>
            <canvas id="glCanvas" class="layer layer-gl"></canvas>
            <div class="layer layer-top">
                <img id="topImg" src="" alt="">
                <div class="lighting-overlay"></div>
            </div>
        </div>
    </div>

    <!-- 侧边控制面板 -->
    <div id="main-sidebar" class="control-panel">
        <div class="panel-header">
            <h3>控制面板</h3>
            <span class="v-tag">V5.8</span>
        </div>

        <div class="panel-section">
            <div class="slider-row">
                <label>阵列尺寸</label>
                <span id="depth-val">8mm</span>
            </div>
            <input type="range" id="depth-slider" min="6" max="12" step="1" value="8">
        </div>

        <div class="panel-section">
            <div class="slider-row">
                <label>光效透明度</label>
                <span id="bright-val">1.0x</span>
            </div>
            <input type="range" id="bright-slider" min="0.1" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="panel-section">
            <div class="slider-row">
                <label>云膜透明度</label>
                <span id="cloud-opacity-val">1.0x</span>
            </div>
            <input type="range" id="cloud-opacity-slider" min="0.0" max="1.0" step="0.1" value="1.0">
        </div>

            <div class="panel-section">
                <div class="slider-row">
                    <label>动画速率</label>
                    <span id="speed-val">0.8x</span>
                </div>
                <input type="range" id="speed-slider" min="0.1" max="2.0" step="0.1" value="0.8">
            </div>

        <div class="panel-section">
            <div class="label-row">
                <label>背景环境颜色</label>
                <label class="lock-wrapper">
                    <input type="checkbox" id="green-screen-toggle">
                    <span>绿幕模式</span>
                </label>
            </div>
            <div class="color-picker-row">
                <div class="color-preview-wrapper">
                    <div id="bg-color-indicator"></div>
                    <input type="color" id="bg-color-picker" value="#000000">
                </div>
                <input type="text" id="bg-color-hex" class="hex-input-box" value="#000000" spellcheck="false">
            </div>
        </div>

        <div class="panel-section">
            <label>当前版本</label>
            <div class="version-list" id="version-list">
                <div class="loading-status">SCANNING ASSETS...</div>
            </div>
        </div>

        <button id="btn-preview" class="primary-btn">进入预览模式</button>
        <button id="btn-export" class="primary-btn" style="background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5);">导出客户端版</button>
    </div>

    <!-- 预览模式专用的精简 HUD -->
    <div id="preview-hud" class="demo-hud">
        <div class="hud-kernel-tag">TECHSUN VISUAL ENGINE V5.8</div>
        <div class="hud-container">
            <div class="hud-card mini">
                <div class="hud-label-row">
                    <label>阵列尺寸</label>
                    <div class="hud-val" id="hud-depth-val">8mm</div>
                </div>
                <input type="range" id="hud-depth-slider" min="6" max="12" step="1" value="8">
            </div>
            <div class="hud-card mini">
                <div class="hud-label-row">
                    <label>光效透明度</label>
                    <div class="hud-val" id="hud-bright-val">1.0x</div>
                </div>
                <input type="range" id="hud-bright-slider" min="0.1" max="2.0" step="0.1" value="1.0">
            </div>
            <div class="hud-card mini">
                <div class="hud-label-row">
                    <label>动画速率</label>
                    <div class="hud-val" id="hud-speed-val">0.8x</div>
                </div>
                <input type="range" id="hud-speed-slider" min="0.1" max="2.0" step="0.1" value="0.8">
            </div>
        </div>
        <div class="hud-segmented" id="hud-version-list">
            <!-- 动态生成 -->
        </div>
    </div>

    <button id="emergency-exit" class="emergency-btn">返回调试</button>

    <script src="main.js?v=5.6"></script>
</body>
</html>
